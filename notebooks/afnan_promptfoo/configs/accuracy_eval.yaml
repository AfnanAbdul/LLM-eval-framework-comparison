# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "Accuracy of Response Evalutaion"

# Configuration file for promptfoo
# This evaluates the "Accuracy of Response" metric by testing factual questions

prompts:
  - "Answer this question factually: {{input}}"
  - "Provide a factual response: {{input}}"
  - "What is the answer to this question: {{input}}"

providers:
  - anthropic:messages:claude-3-5-sonnet-20241022

tests:
  # History
  - vars:
      input: "Who was the first president of the United States?"
      expected: "George Washington"

  # Science
  - vars:
      input: "What is the chemical symbol for water?"
      expected: "H2O"

  # Geography
  - vars:
      input: "What is the capital city of Japan?"
      expected: "Tokyo"

  # Literature
  - vars:
      input: "Who wrote the novel '1984'?"
      expected: "George Orwell"

  # Math
  - vars:
      input: "What is the square root of 16?"
      expected: "4"